<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Life Score subiendo">
  <title>Mi Life Score subió 40 puntos en 3 semanas</title>
  <defs>
    <linearGradient id="ls-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="ls-donut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C7BFF"/>
      <stop offset="50%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#ls-bg)"/>

  <!-- Hook line at top -->
  <text x="360" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="42" fill="#0B1220">Mi Life Score subió</text>
  <text x="360" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="58" fill="#7C5CFC">40 puntos</text>
  <text x="360" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="28" fill="#64748B">en 3 semanas</text>

  <!-- Phone frame -->
  <rect x="120" y="280" width="480" height="780" rx="64" fill="#0B1220"/>
  <rect x="140" y="300" width="440" height="740" rx="48" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="170" y="346" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">9:41</text>
  <text x="540" y="346" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="22" fill="#0B1220">• • •</text>

  <!-- App Header -->
  <text x="170" y="410" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#64748B">Hola, Diego</text>
  <text x="170" y="450" font-family="Inter, sans-serif" font-weight="800" font-size="32" fill="#0B1220">Inicio</text>

  <!-- Life Score Donut -->
  <g transform="translate(360 640)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#E5E7EB" stroke-width="28"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ls-donut)" stroke-width="28"
            stroke-linecap="round"
            stroke-dasharray="879.6" stroke-dashoffset="263.9"
            transform="rotate(-90)"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="72" fill="#0B1220">70</text>
    <text x="0" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="22" fill="#64748B">Life Score</text>
  </g>

  <!-- Activity rings cluster (small, below) -->
  <g transform="translate(170 840)">
    <circle cx="40" cy="0" r="22" fill="none" stroke="#3B82F644" stroke-width="8"/>
    <circle cx="40" cy="0" r="22" fill="none" stroke="#3B82F6" stroke-width="8" stroke-dasharray="138.2" stroke-dashoffset="27.6" stroke-linecap="round" transform="rotate(-90 40 0)"/>
    <text x="78" y="8" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#0B1220">Hábitos 80%</text>
  </g>
  <g transform="translate(170 900)">
    <circle cx="40" cy="0" r="22" fill="none" stroke="#7C5CFC44" stroke-width="8"/>
    <circle cx="40" cy="0" r="22" fill="none" stroke="#7C5CFC" stroke-width="8" stroke-dasharray="138.2" stroke-dashoffset="55.3" stroke-linecap="round" transform="rotate(-90 40 0)"/>
    <text x="78" y="8" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#0B1220">Entrenos 60%</text>
  </g>
  <g transform="translate(170 960)">
    <circle cx="40" cy="0" r="22" fill="none" stroke="#22C55E44" stroke-width="8"/>
    <circle cx="40" cy="0" r="22" fill="none" stroke="#22C55E" stroke-width="8" stroke-dasharray="138.2" stroke-dashoffset="13.8" stroke-linecap="round" transform="rotate(-90 40 0)"/>
    <text x="78" y="8" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#0B1220">Nutrición 90%</text>
  </g>

  <!-- Bottom QYRO sign -->
  <text x="360" y="1140" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#0B1220">QYRO</text>
  <text x="360" y="1180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#64748B">Tu sistema operativo personal</text>
</svg>
