<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Foto al plato, IA cuenta macros">
  <title>Foto a tu plato, IA que cuenta las calorías</title>
  <defs>
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="fm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C7BFF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="plate-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE7C8"/>
      <stop offset="100%" stop-color="#E8B96B"/>
    </radialGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#fm-bg)"/>

  <!-- Hook -->
  <text x="360" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#0B1220">Foto al plato.</text>
  <text x="360" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#7C5CFC">IA que cuenta</text>
  <text x="360" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#7C5CFC">las calorías.</text>

  <!-- Plate illustration -->
  <g transform="translate(360 480)">
    <circle r="180" fill="url(#plate-grad)" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Food elements -->
    <ellipse cx="-60" cy="-30" rx="60" ry="35" fill="#22C55E"/>
    <ellipse cx="50" cy="-40" rx="50" ry="40" fill="#EF4444"/>
    <ellipse cx="0" cy="50" rx="80" ry="50" fill="#F97316"/>
    <circle cx="-50" cy="60" r="20" fill="#22C55E" opacity="0.7"/>
    <circle cx="80" cy="40" r="14" fill="#22C55E" opacity="0.7"/>
  </g>

  <!-- Arrow + AI badge -->
  <g transform="translate(360 720)">
    <text text-anchor="middle" y="0" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#7C5CFC">↓</text>
    <rect x="-100" y="20" width="200" height="56" rx="28" fill="url(#fm-grad)"/>
    <text x="0" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">✨ IA</text>
  </g>

  <!-- Macros result card -->
  <rect x="60" y="830" width="600" height="280" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="90" y="880" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#64748B">Pollo, arroz y verduras</text>
  <text x="630" y="880" text-anchor="end" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#0B1220">620 kcal</text>

  <g transform="translate(90 920)">
    <text font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">Proteína</text>
    <rect x="0" y="20" width="540" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="0" y="20" width="430" height="14" rx="7" fill="#3B82F6"/>
    <text x="540" y="34" text-anchor="end" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">48g</text>
  </g>
  <g transform="translate(90 990)">
    <text font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">Carbos</text>
    <rect x="0" y="20" width="540" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="0" y="20" width="320" height="14" rx="7" fill="#F97316"/>
    <text x="540" y="34" text-anchor="end" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">64g</text>
  </g>
  <g transform="translate(90 1060)">
    <text font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">Grasa</text>
    <rect x="0" y="20" width="540" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="0" y="20" width="190" height="14" rx="7" fill="#22C55E"/>
    <text x="540" y="34" text-anchor="end" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0B1220">22g</text>
  </g>

  <!-- Bottom CTA -->
  <text x="360" y="1180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="32" fill="#0B1220">QYRO · Nutrición</text>
  <text x="360" y="1230" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="22" fill="#64748B">Mifflin-St Jeor automática</text>
</svg>
