<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Streak 47 días">
  <title>Llevo 47 días de racha. Antes no llegaba a 5.</title>
  <defs>
    <linearGradient id="streak-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#streak-bg)"/>

  <!-- Top hook -->
  <text x="360" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="28" fill="#FCA5A5">Llevo</text>

  <!-- Big number -->
  <text x="360" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="280" fill="url(#fire-grad)">47</text>
  <text x="360" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#FFFFFF">días de racha</text>

  <!-- Fire emoji big -->
  <text x="360" y="600" text-anchor="middle" font-size="180">🔥</text>

  <!-- Streak ring with stats -->
  <g transform="translate(360 800)">
    <circle r="120" fill="none" stroke="#F9731644" stroke-width="20"/>
    <circle r="120" fill="none" stroke="url(#fire-grad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="754.0" stroke-dashoffset="35" transform="rotate(-90)"/>
  </g>

  <!-- Comparison line -->
  <text x="360" y="980" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="32" fill="#FCA5A5">Antes no llegaba a</text>
  <text x="360" y="1040" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF">5 días.</text>

  <!-- QYRO sign -->
  <text x="360" y="1180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF">QYRO · Hábitos</text>
  <text x="360" y="1220" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="22" fill="#94A3B8">Atomic Habits pero ejecutable</text>
</svg>
